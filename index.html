<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism AI 3 - Roblox Assistant Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Midtrans Snap Script (Replace data-client-key with your Client Key) -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="YOUR_MIDTRANS_CLIENT_KEY"></script>
    <style>
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20">
                P3
            </div>
            <div>
                <h1 class="font-bold text-base leading-none text-white">Prism AI 3</h1>
                <span class="text-xs text-indigo-400 font-medium">Pro Roblox Assistant</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Quota Badge -->
            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center space-x-2">
                <i class="fa-solid fa-bolt text-yellow-400 text-xs"></i>
                <span class="text-xs font-semibold text-slate-300">Quota: <span id="quota-display" class="text-emerald-400 font-bold">0</span></span>
            </div>

            <!-- Top Up Button -->
            <button onclick="openPaymentModal()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition shadow-md flex items-center space-x-1.5">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>Top Up</span>
            </button>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        
        <!-- Chat History Window -->
        <div id="chat-window" class="chat-scroll flex-1 overflow-y-auto space-y-4 pr-2 mb-4 min-h-[400px]">
            <!-- Welcome Box -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-center my-6">
                <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-robot text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-white mb-1">Welcome to Prism AI 3!</h2>
                <p class="text-xs text-slate-400 max-w-md mx-auto mb-4">Ready to generate Luau scripts, Roblox decal/image prompts, and assist with Studio errors.</p>
                
                <div class="grid grid-cols-2 gap-2 text-left max-w-md mx-auto">
                    <button onclick="setPrompt('Generate a Luau script for a Roblox Studio Leaderstats system')" class="p-2.5 bg-slate-800/60 hover:bg-slate-800 rounded-xl text-xs border border-slate-700/50 text-slate-300 transition">
                        ⚡ <span class="font-medium">Leaderstats Script</span>
                    </button>
                    <button onclick="setPrompt('Generate an AI prompt for creating a Roblox shirt decal texture')" class="p-2.5 bg-slate-800/60 hover:bg-slate-800 rounded-xl text-xs border border-slate-700/50 text-slate-300 transition">
                        🎨 <span class="font-medium">Decal AI Prompt</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Box Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl">
            <form id="chat-form" onsubmit="handleSend(event)" class="flex items-end space-x-2">
                <textarea id="user-input" rows="1" placeholder="Type Luau script instructions or Roblox ideas..." class="w-full bg-transparent text-sm text-slate-100 placeholder-slate-500 focus:outline-none resize-none px-2 py-1 max-h-32" onkeydown="checkSubmit(event)"></textarea>
                <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white w-9 h-9 rounded-xl flex items-center justify-center transition flex-shrink-0">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Top Up Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 relative shadow-2xl">
            <button onclick="closePaymentModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-2">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
                <h3 class="font-bold text-lg text-white">Top Up AI Quota</h3>
                <p class="text-xs text-slate-400">Select an instant AI access package for Prism AI 3</p>
            </div>

            <div class="space-y-3 mb-6">
                <div class="border border-indigo-500 bg-indigo-500/10 p-4 rounded-2xl flex justify-between items-center cursor-pointer">
                    <div>
                        <div class="font-bold text-sm text-white">Pro Basic Package</div>
                        <div class="text-xs text-indigo-300">50x AI Access Queries</div>
                    </div>
                    <div class="text-right">
                        <div class="font-extrabold text-sm text-emerald-400">Rp 10,000</div>
                    </div>
                </div>
            </div>

            <button onclick="processPayment()" id="pay-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
                Purchase Now
            </button>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        let quota = parseInt(localStorage.getItem('prism_quota') || '5'); // Default 5 starting quota
        updateQuotaUI();

        function updateQuotaUI() {
            document.getElementById('quota-display').innerText = quota;
            localStorage.setItem('prism_quota', quota);
        }

        function setPrompt(text) {
            document.getElementById('user-input').value = text;
            document.getElementById('user-input').focus();
        }

        function checkSubmit(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend(e);
            }
        }

        async function handleSend(e) {
            e.preventDefault();
            const inputEl = document.getElementById('user-input');
            const message = inputEl.value.trim();

            if (!message) return;

            if (quota <= 0) {
                alert('Your AI quota is exhausted! Please top up to continue.');
                openPaymentModal();
                return;
            }

            // Append User Message
            appendMessage('user', message);
            inputEl.value = '';

            // Decrease Quota
            quota--;
            updateQuotaUI();

            // Loading state
            const loadingId = appendLoading();

            try {
                // Call Vercel Backend API
                const response = await fetch('/api/payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'chat', prompt: message })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data.reply) {
                    appendMessage('ai', data.reply);
                } else {
                    appendMessage('ai', 'Sorry, an issue occurred while processing AI response. Please try again later.');
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('ai', 'Failed to connect to the server.');
            }
        }

        function appendMessage(sender, text) {
            const chatWin = document.getElementById('chat-window');
            const isUser = sender === 'user';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            
            msgDiv.innerHTML = `
                <div class="max-w-[85%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${
                    isUser 
                    ? 'bg-indigo-600 text-white rounded-br-none' 
                    : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'
                }">
                    ${text.replace(/\n/g, '<br>')}
                </div>
            `;

            chatWin.appendChild(msgDiv);
            chatWin.scrollTop = chatWin.scrollHeight;
        }

        function appendLoading() {
            const chatWin = document.getElementById('chat-window');
            const id = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'flex justify-start';
            loadingDiv.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 text-slate-400 rounded-2xl rounded-bl-none px-4 py-3 text-xs flex items-center space-x-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
                    <span>Thinking...</span>
                </div>
            `;
            chatWin.appendChild(loadingDiv);
            chatWin.scrollTop = chatWin.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function openPaymentModal() {
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        async function processPayment() {
            try {
                const response = await fetch('/api/payment', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_snap_token' })
                });

                const data = await response.json();

                if (data.token) {
                    closePaymentModal();
                    window.snap.pay(data.token, {
                        onSuccess: function(result){
                            quota += 50;
                            updateQuotaUI();
                            alert('Payment Successful! 50 AI Quota has been added.');
                        },
                        onPending: function(result){ alert('Waiting for payment completion...'); },
                        onError: function(result){ alert('Payment failed.'); }
                    });
                } else {
                    alert('Failed to retrieve Midtrans token.');
                }
            } catch (e) {
                alert('A network error occurred.');
            }
        }
    </script>
</body>
</html>
