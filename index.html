<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism AI 3 - Roblox Assistant</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Midtrans Snap JS (Ganti client key dengan Client Key Sandbox/Production kamu) -->
  <script type="text/javascript"
    src="https://app.sandbox.midtrans.com/snap/snap.js"
    data-client-key="YOUR_MIDTRANS_CLIENT_KEY"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 text-center">
    <h1 class="text-2xl font-bold text-indigo-400 mb-2">Prism AI 3 - Pro Edition</h1>
    <p class="text-slate-400 text-sm mb-6">Generator Prompt & Asisten AI Spesialis Roblox</p>

    <!-- Status Sisa Kuota -->
    <div class="bg-slate-700/50 rounded-lg p-3 mb-6 border border-slate-600 flex justify-between items-center">
      <span class="text-sm text-slate-300">Sisa Kuota AI:</span>
      <span id="quota-count" class="font-bold text-emerald-400 text-lg">0 Akses</span>
    </div>

    <!-- Tombol Beli Kuota -->
    <button id="pay-button" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200">
      Beli Kuota AI (Rp 10.000)
    </button>

    <!-- Area AI Feature (Terbuka setelah punya kuota) -->
    <div id="ai-box" class="mt-6 hidden text-left border-t border-slate-700 pt-4">
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Input Prompt Roblox:</label>
      <textarea id="ai-prompt" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500" rows="3" placeholder="Tulis ide script/decal/desain Roblox kamu..."></textarea>
      <button id="generate-btn" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-sm">Generate AI Result</button>
      <div id="ai-result" class="mt-3 p-3 bg-slate-900 rounded-lg text-xs text-slate-300 border border-slate-800 min-h-[60px] hidden"></div>
    </div>
  </div>

  <script>
    let userQuota = parseInt(localStorage.getItem('ai_quota') || '0');
    updateUI();

    function updateUI() {
      document.getElementById('quota-count').innerText = userQuota + ' Akses';
      if(userQuota > 0) {
        document.getElementById('ai-box').classList.remove('hidden');
      } else {
        document.getElementById('ai-box').classList.add('hidden');
      }
    }

    document.getElementById('pay-button').onclick = async function () {
      try {
        const response = await fetch('/api/payment', { method: 'POST' });
        const data = await response.json();
        
        if (data.token) {
          window.snap.pay(data.token, {
            onSuccess: function(result){
              userQuota += 5; // Tambah 5 kuota setelah sukses bayar
              localStorage.setItem('ai_quota', userQuota);
              updateUI();
              alert('Pembayaran Berhasil! 5 Kuota AI telah ditambahkan.');
            },
            onPending: function(result){ alert('Menunggu pembayaran...'); },
            onError: function(result){ alert('Pembayaran gagal!'); }
          });
        } else {
          alert('Gagal mengambil token transaksi.');
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      }
    };
  </script>
</body>
</html>
